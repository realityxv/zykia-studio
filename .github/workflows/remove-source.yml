name: Remove mistakenly published ZIP from history
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Remove ZIP from reachable history
        run: |
          python3 -m pip install git-filter-repo
          git filter-repo --force --invert-paths --path Zykia-Studio-v63-actualizaciones.zip
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin main
